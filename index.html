<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Treasure Hunt Memory Game</title>

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#1f2937,#111827);
    color:white;
    text-align:center;
    padding-top:30px;
    margin:0;
}

h1{
    font-size:32px;
}

.grid{
    width:90%;
    max-width:420px;
    margin:40px auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.card{
    width:100%;
    aspect-ratio:1;
    background:#374151;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.matched{
    border:3px solid #10b981;
}

#message{
    max-width:700px;
    margin:40px auto;
    font-size:20px;
    line-height:1.6;
    opacity:0;
    transition:opacity 1.5s;
    padding:0 20px;
}

</style>
</head>

<body>

<h1>🔎 Treasure Hunt Memory Challenge</h1>
<p>Match the colors to unlock the next clue</p>

<div class="grid" id="grid"></div>

<div id="message"></div>

<script>

/* 12 pairs + 1 bonus card = 25 */

const colors = [
"#ef4444","#ef4444",
"#f59e0b","#f59e0b",
"#10b981","#10b981",
"#3b82f6","#3b82f6",
"#8b5cf6","#8b5cf6",
"#ec4899","#ec4899",
"#22c55e","#22c55e",
"#eab308","#eab308",
"#14b8a6","#14b8a6",
"#6366f1","#6366f1",
"#f97316","#f97316",
"#06b6d4","#06b6d4",
"#000000"  // bonus card
];

let shuffled = colors.sort(()=>0.5-Math.random());

let first=null;
let second=null;
let lock=false;
let matches=0;

const grid=document.getElementById("grid");

shuffled.forEach(color=>{

let card=document.createElement("div");
card.classList.add("card");

card.dataset.color=color;

card.onclick=()=>flip(card);

grid.appendChild(card);

});

function flip(card){

if(lock || card.classList.contains("matched")) return;

card.style.background=card.dataset.color;

if(card.dataset.color=="#000000"){
card.classList.add("matched");
return;
}

if(!first){
first=card;
return;
}

second=card;
lock=true;

if(first.dataset.color===second.dataset.color){

first.classList.add("matched");
second.classList.add("matched");

matches++;

reset();

if(matches===12){
setTimeout(showClue,800);
}

}else{

setTimeout(()=>{

first.style.background="#374151";
second.style.background="#374151";

reset();

},700);

}

}

function reset(){
[first,second,lock]=[null,null,false];
}

function showClue(){

let msg=document.getElementById("message");

msg.style.opacity=1;

msg.innerHTML=`
<h1>🎉 Congrats! You completed the game 🎉</h1>
<p>Preparing your next clue...</p>
`;

setTimeout(()=>{

msg.innerHTML=`

<h1>Next Clue</h1>

<p>

1n 0n3 c0rn3r 0f th3 0ff1c3, w0rk s0m3t1m3s fad3s away  
and laugh t3r b3g1ns t0 gr0w l0ud3r.  
Scr33ns gl0w br1ghtly wh1l3 fr13ndly battl3s unf0ld.

<br><br>

Butt0ns ar3 pr3ss3d,  
v1ct0r13s c3l3brat3d,  
and r1vals ar3 mad3 1n m0m3nts.

<br><br>

S0m3 g0 th3r3 t0 r3lax,  
0th3rs t0 pr0v3 th31r gam1ng sk1lls.

<br><br>

S33k th3 plac3 wh3r3 c0ntr0ll3rs rul3  
and d1g1tal w0rlds c0m3 al1v3.

<br><br>

<strong>Y0ur n3xt clu3 wa1ts th3r3.</strong>

</p>

`;

},3000);

}

</script>

</body>
</html>
